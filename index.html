<!doctype html><html lang="ru"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Обеды на завтра</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style id="app-style">
/* Layout: sticky header + category rail, dish grid by category, fixed cart bar → bottom sheet */
:root{
  --bg:#F6F4F8; --surface:#FFFFFF; --ink:#261A33; --muted:#6C6177; --line:#E4DEEA;
  --accent:#F4B000; --accent-ink:#261A33; --plum:#5B2A86; --ph:#F1ECF5;
  --ok:#23845A; --warn:#B4400E; --shadow:0 10px 30px rgba(38,26,51,.12);
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16101C; --surface:#211929; --ink:#F2EDF7; --muted:#A99CB6; --line:#382D44;
  --accent:#FFC21F; --accent-ink:#1D1424; --plum:#CBA8F2; --ph:#2A2133;
  --ok:#5BC994; --warn:#FF9B6B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16101C; --surface:#211929; --ink:#F2EDF7; --muted:#A99CB6; --line:#382D44;
  --accent:#FFC21F; --accent-ink:#1D1424; --plum:#CBA8F2; --ph:#2A2133;
  --ok:#5BC994; --warn:#FF9B6B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand b{background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:6px;margin-right:2px}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status.closed i{background:var(--warn)}
.mybtn{flex:none;border:1px solid color-mix(in oklab,var(--accent) 60%,var(--line));background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mybtn b{background:var(--accent);color:var(--accent-ink);border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media (max-width:400px){.top-row{gap:8px}.status{padding:6px 9px;font-size:12px}.mybtn{padding:6px 10px;font-size:12px}}
.hist{display:grid;gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.hcard.up{border-color:color-mix(in oklab,var(--accent) 70%,var(--line))}
.hcard .hh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.hcard .hh b{font-size:15px}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ph);color:var(--muted)}
.pill.up{background:var(--accent);color:var(--accent-ink)}
.hcard ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.hcard ul li{display:flex;justify-content:space-between;gap:10px}
.hcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip[aria-current="true"] small{color:inherit;opacity:.7}

/* hero */
.hero{padding-block:28px 8px;display:grid;gap:18px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6.4vw,58px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.hero h1 span{position:relative;white-space:nowrap}
.hero h1 span::after{content:"";position:absolute;left:-2px;right:-4px;bottom:.04em;height:.32em;background:var(--accent);z-index:-1;border-radius:4px;transform:skew(-8deg)}
.hero h1{isolation:isolate}
.sub{font-size:17px;color:var(--muted);margin:0}
.sub strong{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:820px}
.fact{background:var(--surface);padding:12px 14px;min-width:0}
.fact .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fact .val{font-weight:600;font-size:15px;margin-top:2px}
.fact .hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--plum);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;max-width:420px}
.search input{border:0;background:transparent;padding:11px 0;flex:1;min-width:0;outline:none}
.search svg{flex:none;color:var(--muted)}

/* menu */
.cat{padding-block:26px 6px;scroll-margin-top:120px}
.cat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.cat-head h2{font-family:var(--f-display);font-weight:500;font-size:21px;letter-spacing:-.02em;margin:0}
.cat-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
.card.in-cart{border-color:color-mix(in oklab,var(--accent) 70%,var(--line))}
.card.is-hidden{opacity:.55}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--ph);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:44%;height:auto;color:color-mix(in oklab,var(--muted) 60%,var(--ph))}
.badge{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px}
.qtybadge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 7px}
.body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.name{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.price{font-weight:700;font-size:16px;white-space:nowrap}
.price small{font-weight:500;font-size:12px;color:var(--muted);margin-left:2px}
.add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.add:active{transform:scale(.97)}
.step{display:inline-flex;align-items:center;background:var(--ph);border-radius:10px;height:36px}
.step button{border:0;background:none;width:34px;height:36px;font-size:19px;font-weight:600;line-height:1}
.step span{min-width:20px;text-align:center;font-weight:700}
@media (max-width:520px){.add{padding:0 11px}.add .t{display:none}.price{font-size:15px}}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.pick{padding-block:8px 4px;display:grid;gap:10px}
.pick h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;letter-spacing:-.01em}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:820px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat-tile{display:grid;justify-items:center;gap:4px;padding:12px 6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:center;min-width:0}
.cat-tile:hover{border-color:var(--accent)}
.cat-tile svg{width:38px;height:38px;color:var(--plum)}
.cat-tile b{font-size:13.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.cat-tile small{font-size:12px;color:var(--muted)}
.field.err input{border-color:var(--warn);background:color-mix(in oklab,var(--warn) 7%,var(--surface))}
.err-msg{font-size:12.5px;color:var(--warn);font-weight:600}
.req{color:var(--warn)}
.sec{display:block;text-align:center;font-weight:600;color:var(--plum);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.imp textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (max-width:560px){.facts{grid-template-columns:1fr}.fact{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}.fact .lbl{grid-row:span 2}}
@media (max-width:420px){.brand span{display:none}}

/* footer */
.footer{padding-block:40px 140px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:30px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);padding:14px 18px;box-shadow:var(--shadow);text-align:left}
.cartbar .cnt{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;min-width:30px;height:30px;display:grid;place-items:center;padding:0 8px}
.cartbar .lbl{font-weight:600;flex:1}
.cartbar .sum{font-weight:700;font-size:17px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,28,.45);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);max-width:620px;margin:0 auto}
@media (min-width:720px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;max-height:88%}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px var(--gut-r) 10px var(--gut-l);border-bottom:1px solid var(--line)}
.sheet-h h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.x{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;font-size:18px;border:1px solid var(--line)}
.sheet-b{overflow-y:auto;padding:12px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:grid;gap:16px}
.lines{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .n{font-weight:500;font-size:14px;min-width:0;overflow-wrap:anywhere}
.line .p{font-weight:600;white-space:nowrap;min-width:64px;text-align:right}
.tot{display:grid;gap:6px;font-size:14px}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{font-size:18px;font-weight:700;padding-top:6px;border-top:1px dashed var(--line)}
.tot .muted{color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.note{font-size:13px;color:var(--muted);background:var(--ph);border-radius:10px;padding:10px 12px}
.note.warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 12%,var(--surface))}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:14px 16px;font-size:16px;width:100%;text-align:center;text-decoration:none;display:block}
.primary[aria-disabled="true"]{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{width:100%;min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.done{text-align:center;display:grid;gap:8px;padding:6px 0}

/* editor */
.edit-panel{margin-top:22px;background:var(--surface);border:1px dashed var(--plum);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.edit-panel h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:16px}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ed{display:grid;gap:7px;padding:10px 12px 12px;border-top:1px dashed var(--line)}
.ed input,.ed select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%;min-width:0;font-size:13.5px}
.ed .r{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed .acts{display:flex;flex-wrap:wrap;gap:6px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600}
.mini.danger{color:var(--warn)}
.ed label.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.ed label.chk input{width:auto}
.ph .up{position:absolute;inset:auto 8px 8px auto;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;border:0}
.ph.drop{outline:3px dashed var(--accent);outline-offset:-6px}
.addcard{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);min-height:160px;color:var(--muted);font-weight:600}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--ink);color:var(--bg);padding:12px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .t{flex:1;min-width:160px;font-weight:600;font-size:14px}
.savebar .t small{display:block;font-weight:400;opacity:.75}
.savebar button{border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.savebar .s{background:var(--accent);color:var(--accent-ink)}
.savebar .c{background:transparent;color:var(--bg);border:1px solid color-mix(in oklab,var(--bg) 40%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{opacity:.4;translate:0 24px}}}

/* v6: доставка в корзине, очередь отправки, оплата, админка */
.tot .acc{color:var(--plum);font-weight:600}
.tot .free{color:var(--ok);font-weight:700}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in oklab,var(--warn) 12%,var(--surface));color:var(--ink);border:1px solid color-mix(in oklab,var(--warn) 45%,var(--line));border-radius:var(--r);padding:12px 14px;max-width:820px;font-size:14.5px}
.banner b{color:var(--warn)}
.banner .ic{font-size:18px;line-height:1.2}
.ok-big{display:grid;justify-items:center;gap:6px;text-align:center;padding:8px 0 2px}
.ok-big .tick{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700}
.ok-big h4{margin:0;font-family:var(--f-display);font-weight:500;font-size:19px}
.sync{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);justify-content:center}
.sync.ok{color:var(--ok);font-weight:600}
.sync.bad{color:var(--warn);font-weight:600}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pill.ok{background:color-mix(in oklab,var(--ok) 18%,var(--surface));color:var(--ok)}
.pill.bad{background:color-mix(in oklab,var(--warn) 16%,var(--surface));color:var(--warn)}
.paybox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;justify-items:center;text-align:center}
.qr{background:#fff;padding:12px;border-radius:14px;width:min(260px,72vw);aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.amount{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em}
.amount small{font-size:15px;font-weight:500;color:var(--muted)}
.paylist{display:grid;gap:8px;width:100%;text-align:left}
.payrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.payrow input{width:18px;height:18px;accent-color:var(--plum)}
.payrow .d{font-weight:600}
.payrow .s{font-size:12.5px;color:var(--muted)}
.payrow .t{font-weight:700;white-space:nowrap}
.adm{display:grid;gap:14px}
.adm section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.adm h4{margin:0;font-size:15px}
.adm .r3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:480px){.adm .r3{grid-template-columns:1fr 1fr}.adm .r3 button{grid-column:span 2}}
.adm .lst{display:grid;gap:6px;font-size:14px}
.adm .lst div{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px dashed var(--line);padding-top:6px}
.adm .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.adm .stat{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.adm .stat b{display:block;font-size:14.5px}
.adm .quick{display:flex;gap:6px;flex-wrap:wrap}
.adm input,.adm select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.adm label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.adm label.chk input{width:auto}
.adminbtn{flex:none;border:1px dashed var(--plum);background:var(--surface);color:var(--plum);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.who-list{display:grid;gap:4px;font-size:13.5px}
.who-list div{display:flex;justify-content:space-between;gap:8px}
.paybox a.ghost{color:var(--ink)}
/* КБЖУ */
.kb{border:0;background:none;padding:0;color:var(--muted);font:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.kb:hover{color:var(--plum)}
.ntab{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14.5px}
.ntab th,.ntab td{padding:9px 12px;text-align:left;border-top:1px solid var(--line)}
.ntab thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ntab tbody th{font-weight:500}
.nctl{display:flex;justify-content:flex-end}
.tot .kbju span:last-child{text-align:right;white-space:nowrap}
.tot .kbju small{display:block;font-size:12.5px}
.ed .r4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ed .r4 input{padding:6px 4px;font-size:12.5px}
/* Оплата через приложение банка */
.banks-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:360px){.banks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bank{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;line-height:1.15}
.bank:hover,.bank:focus-visible{border-color:var(--accent)}
.bank:active{transform:scale(.98)}
.sheet:not(.in){animation:none}
</style>

<script id="app-script">
(function(){

// Обеды на завтра v6 — статический сайт (GitHub Pages). Данные и приём заказов — Google Apps Script (settings.endpoint).

};

function isoMs(iso){ var p=String(iso).split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2]); }

    if(closed[iso]){ skipped.push({iso:iso, ms:d, reason:closed[iso]}); continue; }
    break;
  }
  var days=Math.round((d-today)/DAY), dlDay=prevWork(d), dlToday=dlDay===today, tm=dlTimeFor(isoOf(d));
  var weekend=false; for(var x=today+DAY;x<d;x+=DAY){ if(!isWork(x)) weekend=true; }
  weekend = weekend && new Date(d).getUTCDay()===1 && !late && !skipped.length;
  var ext=hm(extMap()[isoOf(d)])!=null;
  return {iso:isoOf(d), ms:d, today:today, days:days, label:dayLabel(d), short:dayShort(d), time:tm, ext:ext,
    left:Math.max(0,Math.floor((dlMs-now)/6e4)), dlToday:dlToday, weekend:weekend, late:late, skipped:skipped,
    dlLabel: dlToday ? "сегодня до "+tm : "до "+tm+" "+vPrep(dlDay)+WD[new Date(dlDay).getUTCDay()],
    dlShort: dlToday ? "до "+tm : "до "+WD_S[new Date(dlDay).getUTCDay()]+" "+tm,

function nv(x){ return x===null||x===undefined||x===""||!isFinite(+x)?null:+x; }

function portionGrams(d){ var t=0; String(d.weight||"").replace(/(\d+(?:[.,]\d+)?)\s*(?:г|гр)(?![а-яё])/gi,function(_,x){ t+=parseFloat(x.replace(",",".")); return _; }); return t; }

function fetchT(u, opt, ms){
  var ctl=window.AbortController?new AbortController():null, tm=null;
  if(ctl){ opt.signal=ctl.signal; tm=setTimeout(function(){ ctl.abort(); }, ms); }
  return fetch(u,opt).then(function(r){ clearTimeout(tm); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }, function(e){ clearTimeout(tm); throw e; });
}
function apiGet(params){
  if(!ENDPOINT) return Promise.reject(new Error("no endpoint"));
  var q=Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
  return fetchT(ENDPOINT+"?"+q+"&_="+Date.now(),{method:"GET",redirect:"follow",cache:"no-store"}, 30000);
}
function apiPost(body, keepalive, ms){
  if(!ENDPOINT) return Promise.reject(new Error("no endpoint"));
  var opt={method:"POST",redirect:"follow",body:JSON.stringify(body)};
  if(keepalive) opt.keepalive=true;
  return fetchT(ENDPOINT,opt, ms||30000);
}

var OUTBOX="lunch-outbox-v6";
var flushing=false, retryTimer=null, retryDelay=2000;
// Очередь держим и в памяти: если хранилище браузера недоступно, заказ всё равно уйдёт, пока страница открыта.
var memOutbox=null, lsOk=true;
function outbox(){ if(lsOk){ var a=LS.get(OUTBOX,null); if(Array.isArray(a)) return a; } return memOutbox?memOutbox.slice():[]; }
function setOutbox(a){ lsOk=LS.set(OUTBOX,a); memOutbox=a.slice(); }
function enqueue(o){ var a=outbox().filter(function(x){ return x.o.id!==o.id; }); a.push({o:o, at:Date.now(), tries:0}); setOutbox(a); if(!lsOk) toast("Не закрывайте страницу, пока заказ не запишется в таблицу"); }
function flushOutbox(){
  if(flushing||!ENDPOINT) return; var a=outbox(); if(!a.length) return;
  flushing=true; clearTimeout(retryTimer);
  var item=a[0];
  apiPost({t:"order",o:item.o}, true).then(function(r){
    flushing=false;
    if(!r || (!r.ok && !r.code)) throw new Error("bad response");
    if(r.ok===false && (r.code==="error"||r.code==="bad_json")) throw new Error(r.error||r.code);
    setOutbox(outbox().filter(function(x){ return x.o.id!==item.o.id; }));
    retryDelay=2000;
    if(r.ok){ updHist(item.o.id,{status:"saved", srv:r.status}); if(r.status==="outdated") toast("В таблице уже есть ваш более новый заказ на этот день"); }
    else {
      var msg = r.code==="closed" ? "На "+dayShort(isoMs(r.date))+" приём закрыт: "+(r.reason||"") :
                r.code==="weekend" ? "В выходные обеды не возим" :
                r.code==="late" ? "Заказ не успел до окончания приёма" : "Заказ не принят: проверьте имя и блюда";
      updHist(item.o.id,{status:"rejected", msg:msg, next:r.next||""});
      toast(msg+". Заказ не записан");
    }
    loadConfig(true); myData=null;
    if(sheetMode==="sent") renderSheet(); else if(sheetMode==="my"){ loadMy(); renderSheet(); }
    flushOutbox();
  }).catch(function(){
    flushing=false;
    var b=outbox(); b.forEach(function(x){ if(x.o.id===item.o.id) x.tries=(x.tries||0)+1; }); setOutbox(b);
    updHist(item.o.id,{status:"sending", retry:true});
    if(sheetMode==="sent"||sheetMode==="my") renderSheet();
    retryTimer=setTimeout(flushOutbox, retryDelay); retryDelay=Math.min(60000, retryDelay*2);
  });
}

  var last={}; outbox().forEach(function(x){ last[x.o.date+"|"+x.o.last.toLowerCase()+"|"+x.o.first.toLowerCase()]=x; });

}

// ---------- QR (оплата) ----------
// Текст QR банка: https://bank.kicb.net/#000201… (TLV по стандарту QR-платежей КР, тег 63 = последние 4 hex SHA-256).
function tlvParse(s){ var out=[], i=0; while(i+4<=s.length){ var tag=s.substr(i,2), len=parseInt(s.substr(i+2,2),10); if(isNaN(len)) return null; out.push({tag:tag, val:s.substr(i+4,len)}); i+=4+len; } return i===s.length?out:null; }
function tlvJoin(a){ return a.map(function(x){ return x.tag+String(x.val.length).padStart(2,"0")+x.val; }).join(""); }
function sha256hex(str){
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder)) return Promise.reject(new Error("no crypto"));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); });
}
// Пробел, «%», «#», управляющие и не-ASCII символы в URL-фрагменте кодируем (UTF-8), остальное как есть.
function fragEncode(s){ var out=""; Array.from(s).forEach(function(ch){ var c=ch.charCodeAt(0); out+= (ch===" "||ch==="%"||ch==="#"||c<32||c>127) ? encodeURIComponent(ch) : ch; }); return out; }
// Фрагмент ELQR (всё после #) из текста QR; amount>0 — вставить сумму (тег 54, в тыйынах) и пересчитать контрольную сумму.
// При любой ошибке — исходный фрагмент без суммы.
function qrFragment(text, amount){
  var base=String(text||""), hashAt=base.indexOf("#"); if(hashAt<0) return Promise.resolve(null);
  var orig=base.slice(hashAt+1); if(!amount) return Promise.resolve(orig);
  var payload; try{ payload=decodeURIComponent(orig); }catch(e){ return Promise.resolve(orig); }
  var t=tlvParse(payload); if(!t) return Promise.resolve(orig);
  t=t.filter(function(x){ return x.tag!=="63" && x.tag!=="54"; });
  t.forEach(function(x){ if(x.tag==="01") x.val="12"; });  // с суммой QR становится динамическим
  t.push({tag:"54", val:String(Math.round(amount*100))});
  t.sort(function(a,b){ return +a.tag-+b.tag; });
  var body=tlvJoin(t);
  return sha256hex(body).then(function(h){ return fragEncode(body+"6304"+h.slice(-4)); }, function(){ return orig; });
}
function qrWithAmount(text, amount){
  var base=String(text||""), hashAt=base.indexOf("#"); if(!amount || hashAt<0) return Promise.resolve(base);
  return qrFragment(base, amount).then(function(f){ return base.slice(0,hashAt+1)+f; });
}
// Ссылки для открытия платежа сразу в приложении банка (стандарт ELQR: префикс банка + тот же фрагмент).
// pay.payqr.kg — универсальная ссылка ELQR: открывает любое банковское приложение КР.

  {n:"MBank", u:"https://app.mbank.kg/qr/"},

  try{ var q=qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:0, scalable:true}); }catch(e){ return '<p class="note">QR не построился</p>'; }

function resizeImage(file, maxW, q){

    var url=URL.createObjectURL(file); var img=new Image();
    img.onload=function(){ var w=img.naturalWidth, h=img.naturalHeight; var k=Math.min(1, maxW/w); var cw=Math.round(w*k), ch=Math.round(h*k);
      var tw=cw, th=Math.round(cw*3/4); if(th>ch){ th=ch; tw=Math.round(ch*4/3); }
      var cv=document.createElement("canvas"); cv.width=tw; cv.height=th; var x=cv.getContext("2d");
      var sw=tw/k, sh=th/k, sx=(w-sw)/2, sy=(h-sh)/2;
      x.drawImage(img, sx, sy, sw, sh, 0, 0, tw, th); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", q)); };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src=url;
  });
}

    toast((r&&r.error)||"Не сохранилось. Попробуйте ещё раз"); if(b){ b.disabled=false; b.textContent="Сохранить для всех"; }
  },function(){ toast("Нет связи с таблицей. Попробуйте ещё раз"); if(b){ b.disabled=false; b.textContent="Сохранить для всех"; } });
}

// ---------- events ----------
var sheetVia="send"; var lastSent=null;
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-act]");
  if(!el || !app.contains(el)){ if(editing){ var ph=e.target.closest("[data-ph]"); if(ph){ pendingPhotoId=ph.getAttribute("data-ph"); fileInput.click(); } } return; }
  var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  if(act==="inc"||act==="dec"){
    cart[id]=(cart[id]||0)+(act==="inc"?1:-1); if(cart[id]<=0) delete cart[id]; if(cart[id]>99) cart[id]=99; persistCart();
    var card=null; app.querySelectorAll(".card").forEach(function(c){ if(c.getAttribute("data-id")===id) card=c; });
    if(card){ card.classList.toggle("in-cart", !!cart[id]); var ctl=card.querySelector('[data-ctl]'); if(ctl) ctl.innerHTML=ctlHtml(id);
      var ph2=card.querySelector(".ph"); var qb=ph2.querySelector(".qtybadge"); if(cart[id]){ if(!qb){ qb=document.createElement("span"); qb.className="qtybadge num"; ph2.appendChild(qb);} qb.textContent="×"+cart[id]; } else if(qb) qb.remove(); }
    renderCartBar(); if(sheetMode==="cart"||sheetMode==="nutr") renderSheet(); return;
  }
  if(act==="jump"){ if(query){ query=""; var qi=document.getElementById("q"); if(qi) qi.value=""; renderMenu(); } var sec=document.getElementById("cat-"+el.getAttribute("data-cat")); if(sec) sec.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
  if(act==="opencart"){ openSheet("cart"); return; }
  if(act==="nutr"){ nutrId=id; openSheet("nutr"); return; }
  if(act==="my"){ openSheet("my"); return; }
  if(act==="myreload"){ myData=null; loadMy(); renderSheet(); return; }
  if(act==="pay"){ paySel=null; openSheet("pay"); return; }
  if(act==="cal"){ openSheet("cal"); loadConfig(true); return; }
  if(act==="copysum"){ copyText(el.getAttribute("data-sum"), null); return; }
  if(act==="restore"){ if(lastSent){ var miss=fillCart(lastSent.items,true); toast(miss?"Часть блюд уже нет в меню":"Блюда вернулись в корзину"); openSheet("cart"); } return; }
  if(act==="repeat"||act==="histdel"){ var hid=el.getAttribute("data-hid"); var hl=loadHist(); var en=hl.filter(function(x){ return x.id===hid; })[0]; if(!en) return;
    if(act==="repeat"){ var miss2=fillCart(en.items,true); toast(miss2?"Часть блюд уже нет в меню":"Заказ добавлен в корзину"); openSheet("cart"); }
    else { saveHist(hl.filter(function(x){ return x.id!==hid; })); renderSheet(); }
    return; }
  if(act==="close"){ closeSheet(); return; }
  if(act==="send"){
    readForm(); var er=nameErrors();
    if(er.last||er.first){ showErrors=true; updateLinks(); var bad=document.getElementById(er.last?"o-last":"o-first"); if(bad) bad.focus(); toast("Заполните фамилию и имя"); return; }
    var t=timeInfo();
    // Дата сменилась после того, как кнопку нарисовали: показываем предупреждение и ждём повторного нажатия.
    if(el.getAttribute("data-iso")!==t.iso){ refreshCartDynamic(); toast("Время заказа истекло — заказ пойдёт на "+t.short); return; }
    LS.set("lunch-who-v1", who);
    var o=orderPayload(t.iso); o.sentAt=nowMs();
    sheetVia="send"; lastSent=cartToEntry("send", o); addHist(lastSent); enqueue(o);
    cart={}; persistCart(); savedComment=""; showErrors=false; myData=null;
    renderMenu(); renderCartBar(); openSheet("sent");
    flushOutbox(); return;
  }
  if(act==="wa"){
    readForm(); var er3=nameErrors();
    if(er3.last||er3.first){ e.preventDefault(); showErrors=true; updateLinks(); toast("Заполните фамилию и имя"); return; }
    updateLinks();
    if(!ENDPOINT){ var o2=orderPayload(timeInfo().iso); sheetVia="wa"; lastSent=cartToEntry("wa", o2); addHist(lastSent); setTimeout(function(){ cart={}; persistCart(); savedComment=""; renderMenu(); renderCartBar(); openSheet("sent"); }, 350); }
    return;
  }
  if(act==="copyorder"){ readForm(); var er2=nameErrors(); if(er2.last||er2.first){ showErrors=true; updateLinks(); toast("Заполните фамилию и имя"); return; } copyText(orderText(fullName(),savedComment.trim()), document.getElementById("o-prev")); return; }
  if(act==="clear"){ cart={}; persistCart(); closeSheet(); renderMenu(); renderCartBar(); toast("Корзина очищена"); return; }
  if(act==="copyphone"){ copyText(phonePretty(S().phone), null); return; }
  // admin
  if(act==="admin"){ adminDay=null; openSheet("admin"); return; }
  if(act==="alogout"){ setAdmin(null); toast("Режим администратора выключен"); return; }
  if(act==="admday"){ adminCall({a:"day",date:el.getAttribute("data-date")}).then(function(r){ if(r&&r.ok){ adminDay=r; renderSheet(); } }); return; }
  if(act==="aext"){ adminDo({a:"extend",date:val("a-ext-d"),time:val("a-ext-t")},"Приём продлён"); return; }
  if(act==="aquick"){ var tq=timeInfo(), k=(tq.late&&tq.late.iso)||tq.iso; var base=Math.max(hm(dlTimeFor(k))||0, (function(){ var n=bk(); return n.getUTCHours()*60+n.getUTCMinutes(); })()); var m=Math.min(23*60+59, base+(+el.getAttribute("data-min"))); var tm=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); adminDo({a:"extend",date:k,time:tm},"Приём на "+dayShort(isoMs(k))+" продлён до "+tm); return; }
  if(act==="aunext"){ adminDo({a:"unextend",date:el.getAttribute("data-date")},"Продление отменено"); return; }
  if(act==="aclose"){ adminDo({a:"close",date:val("a-cl-d"),reason:val("a-cl-r")},"День закрыт для заказов"); return; }
  if(act==="aopen"){ adminDo({a:"open",date:el.getAttribute("data-date")},"Приём открыт"); return; }
  if(act==="asave"){ var qa=document.getElementById("a-s-qrAmount"); adminDo({a:"settings",settings:{deadline:val("a-s-deadline"),delivery:val("a-s-delivery"),freeFrom:val("a-s-freeFrom"),contact:val("a-s-contact"),phone:val("a-s-phone"),payee:val("a-s-payee"),qr:val("a-s-qr"),qrAmount:!!(qa&&qa.checked)}},"Настройки сохранены"); return; }
  // editor
  if(act==="editon"){ setEditing(true); return; }
  if(act==="editoff"){ setEditing(false); return; }
  if(act==="photo"){ pendingPhotoId=id; fileInput.click(); return; }
  if(act==="unphoto"){ dish(id).photo=""; markDirty(); refreshCard(id); return; }
  if(act==="del"){ if(el.getAttribute("data-armed")){ menu.dishes=menu.dishes.filter(function(d){return d.id!==id;}); delete cart[id]; persistCart(); markDirty(); renderMenu(); } else { el.setAttribute("data-armed","1"); el.textContent="Точно удалить?"; } return; }
  if(act==="newdish"){ var nid="n"+Date.now().toString(36); menu.dishes.push({id:nid,cat:el.getAttribute("data-cat"),name:"Новое блюдо",weight:"300 г",price:200,photo:"",hidden:false}); markDirty(); renderMenu(); var inp=document.getElementById("n-"+nid); if(inp){ inp.focus(); inp.select(); } return; }
  if(act==="import"){ var ta=document.getElementById("imp"); var n=0; try{ var pk=JSON.parse(ta.value); var phs=pk&&pk.photos||{}; Object.keys(phs).forEach(function(pid){ var d=dish(pid); var v=String(phs[pid]||""); if(d&&/^data:image\/(jpeg|png|webp);base64,/.test(v)&&v.length<49000){ d.photo=v; n++; } }); }catch(err){ toast("Не удалось прочитать пакет фото"); return; } ta.value=""; if(n){ markDirty(); renderMenu(); } toast(n?"Загружено фото: "+n+". Нажмите «Сохранить для всех»":"В пакете нет подходящих фото"); return; }
  if(act==="save"){ save(); return; }
  if(act==="revert"){ menu.dishes=clone(saved.dishes); menu.categories=clone(saved.categories); dirty=false; renderEditSlot(); renderMenu(); renderSaveBar(); renderInfo(); toast("Изменения отменены"); return; }
});
app.addEventListener("input", function(e){
  var t=e.target;
  if(t.id==="q"){ query=t.value; renderMenu(); return; }
  if(t.id==="o-last"||t.id==="o-first"||t.id==="o-company"||t.id==="o-com"){ updateLinks(); return; }
  var f=t.getAttribute("data-f"), id=t.getAttribute("data-id");
  if(f&&id){ var d=dish(id); if(!d) return;
    if(f==="name") d.name=t.value; else if(f==="weight") d.weight=t.value; else if(f==="price") d.price=Math.max(0,Math.round(+t.value||0));
    else if(f.indexOf("n-")===0){ var key=f.slice(2), v=t.value.trim()===""?null:Math.max(0,Math.round(parseFloat(t.value.replace(",","."))*10)/10); d.nutr=Object.assign({},d.nutr||{}); if(v==null||isNaN(v)) delete d.nutr[key]; else d.nutr[key]=v; if(!Object.keys(d.nutr).length) delete d.nutr; }
    markDirty(); return; }
});
app.addEventListener("change", function(e){
  var t=e.target;
  if(t.hasAttribute("data-pay")){ paySel=paySel||{}; paySel[t.getAttribute("data-pay")]=t.checked; renderSheet(); return; }
  if(t.id==="o-last"||t.id==="o-first"){ cfgAt=0; loadConfig(); return; }
  var f=t.getAttribute("data-f"), id=t.getAttribute("data-id"); if(!f||!id) return; var d=dish(id); if(!d) return;
  if(f==="cat"){ d.cat=t.value; markDirty(); renderMenu(); }
  if(f==="shown"){ d.hidden=!t.checked; markDirty(); refreshCard(id); renderRail(); }
});
app.addEventListener("dragover", function(e){ if(!editing) return; var ph=e.target.closest("[data-ph]"); if(ph){ e.preventDefault(); ph.classList.add("drop"); } });
app.addEventListener("dragleave", function(e){ var ph=e.target.closest("[data-ph]"); if(ph) ph.classList.remove("drop"); });
app.addEventListener("drop", function(e){ if(!editing) return; var ph=e.target.closest("[data-ph]"); if(!ph) return; e.preventDefault(); ph.classList.remove("drop"); var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) setPhoto(ph.getAttribute("data-ph"), f); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape"&&sheetMode) closeSheet(); });
window.addEventListener("online", flushOutbox);
window.addEventListener("pagehide", function(){ if(outbox().length) beaconOutbox(); });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible"){ loadConfig(); flushOutbox(); } });
window.addEventListener("beforeunload", function(e){ if(dirty&&editing){ e.preventDefault(); e.returnValue=""; } });

// ---------- boot ----------
(function(){
  var m=location.search.match(/[?&]admin=([A-Za-z0-9_-]{8,64})/);
  if(m){ setAdmin(m[1]); try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){} }
  else { var k=LS.get("lunch-admin-key",null); if(typeof k==="string"&&k) { adminKey=k; canEdit=true; } }
})();
cleanCart(); persistCart();
renderShell(); renderSaveBar();
setInterval(function(){ renderInfo(); renderCartBar(); }, 30000);
setInterval(function(){ if(document.visibilityState==="visible") loadConfig(); }, 120000);
// Заказы, отправленные в прошлый раз и не дошедшие до таблицы, досылаем сразу.
outbox().forEach(function(x){ updHist(x.o.id,{status:"sending"}); });
loadConfig(true).then(function(){ flushOutbox(); });
setTimeout(flushOutbox, 1500);
if(adminKey) loadAdmin();
})();
</script>
